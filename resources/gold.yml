resources:
  jobs:
    gold_pipeline:
      name: "[portfolio] Gold Pipeline"
      tasks:
        - task_key: run_validated_gold
          notebook_task:
            notebook_path: ${workspace.file_path}/pipelines/notebooks/run_validated_gold
            base_parameters:
              catalog: ${var.catalog_name}
          timeout_seconds: 7200
          max_retries: 1
          retry_on_timeout: true
